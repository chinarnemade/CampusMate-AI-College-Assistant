<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CampusMate — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<div class="auth-card glass">
  <div class="auth-logo">✦</div>
  <div class="eyebrow">RAIT • STUDENT AI</div>
  <h1>Welcome to CampusMate</h1>
  <p class="auth-sub">Your AI-powered college companion for campus questions, study help and assignments.</p>

  <div class="auth-tabs">
    <button class="auth-tab active" data-mode="login">Log in</button>
    <button class="auth-tab" data-mode="signup">Create account</button>
  </div>

  <form id="authForm">
    <div id="nameField" class="field hidden">
      <label>Full name</label>
      <input id="name" placeholder="Charles Thomas">
    </div>
    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="Minimum 6 characters" required>
    </div>
    <button class="primary-btn" type="submit" id="authBtn">Continue</button>
    <p id="authError" class="error-text"></p>
  </form>

  <div class="local-note">🔒 Local demo account • Chat history stays on this computer</div>
</div>

<script>
let mode = "login";
const tabs = document.querySelectorAll(".auth-tab");
const nameField = document.getElementById("nameField");
const authBtn = document.getElementById("authBtn");
const error = document.getElementById("authError");

tabs.forEach(tab => tab.onclick = () => {
  mode = tab.dataset.mode;
  tabs.forEach(t => t.classList.toggle("active", t === tab));
  nameField.classList.toggle("hidden", mode !== "signup");
  authBtn.textContent = mode === "login" ? "Log in" : "Create account";
  error.textContent = "";
});

document.getElementById("authForm").onsubmit = async e => {
  e.preventDefault();
  error.textContent = "";
  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  };
  const res = await fetch(mode === "login" ? "/api/login" : "/api/signup", {
    method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!res.ok) { error.textContent = data.error || "Something went wrong."; return; }
  location.href = "/";
};
</script>
</body>
</html>
